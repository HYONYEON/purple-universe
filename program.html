<!DOCTYPE html>
<html lang="ko">
<head>
<base href="/">   <!-- 주소창이 /w/번호 로 바뀌어도 이미지 · 파일 경로가 깨지지 않게 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>프로그램 — 퍼플 유니버스</title>
<meta name="description" content="퍼플 유니버스 멤버들이 함께 만드는 오프라인 프로그램. 원데이 웰니스 프로그램 — 12월 13일(일) 12:00~20:00.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="퍼플 유니버스">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="프로그램 — 퍼플 유니버스">
<meta property="og:description" content="원데이 웰니스 프로그램 — 12월 13일(일) 12:00~20:00 · 30명 한정 · 참가비 30만 원">
<meta property="og:url" content="https://purpleuniverse.net/program">
<meta property="og:image" content="https://purpleuniverse.net/og-program.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="원데이 웰니스 프로그램 — 퍼플 유니버스">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="프로그램 — 퍼플 유니버스">
<meta name="twitter:image" content="https://purpleuniverse.net/og-program.png?v=1">
<link rel="canonical" href="https://purpleuniverse.net/program">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{
    --bg:#08050F; --bg-alt:#0F0A1E; --bg-alt2:#140D26;
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.07);
    --border:rgba(184,155,255,.16); --border-strong:rgba(184,155,255,.32);
    --purple:#7C4DFF; --purple-deep:#5626C4; --purple-bright:#A98BFF; --purple-pale:#C9B6FF;
    --gold:#E8B85E; --gold-soft:#F3D89A;
    --text:#F4F1FC; --text-dim:#B7ACD1; --text-faint:#756A94;
    --ok:#5FD08A;
    --radius:20px; --maxw:1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans KR', sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    word-break:keep-all; overflow-wrap:break-word;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 40px 60px, rgba(232,225,255,.4), transparent),
      radial-gradient(1.2px 1.2px at 140px 20px, rgba(255,255,255,.3), transparent),
      radial-gradient(1.8px 1.8px at 230px 130px, rgba(184,155,255,.35), transparent),
      radial-gradient(1px 1px at 70px 170px, rgba(255,255,255,.25), transparent),
      radial-gradient(1.4px 1.4px at 310px 90px, rgba(232,184,94,.28), transparent),
      radial-gradient(1.6px 1.6px at 360px 270px, rgba(184,155,255,.3), transparent);
    background-repeat:repeat; background-size:420px 420px;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  .eyebrow{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--purple-bright);
  }

  /* ---------- NAV ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(8,5,15,.72); backdrop-filter:blur(14px);
    border-bottom:1px solid transparent; transition:border-color .3s ease;
  }
  header.scrolled{border-bottom-color:var(--border);}
  nav{
    max-width:var(--maxw); margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px;}
  .brand img{width:34px; height:34px; object-fit:contain; display:block; mix-blend-mode:screen; flex:none;}
  .navlinks{display:flex; align-items:center; gap:26px; font-size:17.5px; color:var(--text-dim);}
  .navlinks a:hover{color:var(--text);}
  .nav-sep{width:1px; height:18px; background:var(--border-strong); display:inline-block;}
  .navlinks a{position:relative; padding:6px 2px;}
  .navlinks a.nav-here{
    color:#EFE8FF; font-weight:700;
    text-shadow:0 0 10px rgba(169,139,255,.75), 0 0 22px rgba(124,77,255,.45);
  }
  .navlinks a.nav-here::after{
    content:''; position:absolute; left:50%; bottom:-2px;
    width:100%; height:2px; transform:translateX(-50%); border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--purple-bright), transparent);
    box-shadow:0 0 10px rgba(169,139,255,.8);
    animation:navGlow 2.6s ease-in-out infinite;
  }
  @keyframes navGlow{ 0%,100%{opacity:.75;} 50%{opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .navlinks a.nav-here::after{animation:none;} }
  .navcta{
    background:linear-gradient(135deg,var(--purple),var(--purple-deep));
    color:#fff; padding:10px 20px; border-radius:100px;
    font-size:17px; font-weight:600; box-shadow:0 4px 20px rgba(124,77,255,.35);
  }
  @media(max-width:980px){ .navlinks{display:none;} }

  .navtoggle{
    display:none; flex:0 0 auto; width:42px; height:42px; margin-left:10px;
    align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; cursor:pointer; color:var(--text);
  }
  .navtoggle span{
    display:block; position:relative; width:19px; height:2px; border-radius:2px;
    background:currentColor; transition:transform .28s ease, opacity .2s ease;
  }
  .navtoggle span::before, .navtoggle span::after{
    content:''; position:absolute; left:0; width:19px; height:2px;
    border-radius:2px; background:currentColor; transition:transform .28s ease;
  }
  .navtoggle span::before{top:-6px;}
  .navtoggle span::after{top:6px;}
  .navtoggle.open span{background:transparent;}
  .navtoggle.open span::before{transform:translateY(6px) rotate(45deg);}
  .navtoggle.open span::after{transform:translateY(-6px) rotate(-45deg);}
  .mobmenu{display:none; border-top:1px solid var(--border);
    background:rgba(8,5,15,.97); backdrop-filter:blur(14px);}
  .mobmenu.open{display:block;}
  .mobmenu-inner{padding:10px 28px 22px;}
  .mobmenu a{display:block; padding:15px 2px; font-size:18.5px; color:var(--text-dim);
    border-bottom:1px solid rgba(184,155,255,.10);}
  .mobmenu a:last-child{border-bottom:none;}
  .mobmenu a.mm-page{color:var(--purple-pale); font-weight:600;}
  .mobmenu .mm-divider{height:1px; margin:8px 0; background:var(--border-strong); opacity:.5;}
  @media(max-width:980px){ .navtoggle{display:flex;} }
  @media(min-width:981px){ .mobmenu{display:none !important;} }

  /* ---------- HERO ---------- */
  .w-hero{padding:170px 0 10px; text-align:center;}
  .w-hero h1{font-size:clamp(30px,5vw,54px); font-weight:700; margin-top:16px;}
  .w-hero .mbr{display:none;}
  @media(max-width:760px){ .w-hero .mbr{display:inline;} }
  .w-hero .lead{
    color:var(--text-dim); margin-top:18px; font-size:18px;
    max-width:660px; margin-left:auto; margin-right:auto;
  }
  /* 무료 원칙 — 이 페이지의 핵심 약속 */
  .promise{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px;
  }
  .promise div{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:100px; padding:10px 20px; font-size:15px; color:var(--text-dim);
  }
  .promise b{color:var(--text); font-weight:600;}
  .promise .chk{color:var(--ok); font-weight:700;}
  .lead-link{color:var(--purple-pale); text-decoration:underline; text-underline-offset:4px;}
  .lead-link:hover{color:#fff;}
  .promise .note{border-color:rgba(243,216,154,.28);}
  .promise .dot{color:var(--gold-soft); font-weight:700; font-size:13px;}

  /* ---------- 두 칸: 왼쪽 웨비나 · 오른쪽 클래스 ---------- */
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-top:70px; align-items:start;}
  .duo .sec{margin-top:0; min-width:0;}
  .feat .w-card{cursor:pointer;}
  .feat{max-width:80%;}                     /* PC에선 대표 카드 20% 작게 */
  @media(max-width:900px){ .feat{max-width:none;} }
  /* 대표 카드: 위 포스터(잘림 없이 4:5 그대로) · 아래 문구 */
  .feat .w-body{padding:24px 26px 26px; gap:12px;}
  .feat .w-card h3{font-size:21px;}
  .feat .w-meta{font-size:19.5px;}   /* 대표 카드의 일시 · 시간은 크게 */
  .feat .w-card p{font-size:15px;}

  .rail-head{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px;}
  .rail-head span{font-size:14px; font-weight:600; color:var(--text-faint);}
  .rail-btns{display:flex; gap:6px;}
  .rail-btns button{width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);}
  .rail-btns button:hover{border-color:var(--border-strong);}
  .rail{display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:8px;
    scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent; -webkit-overflow-scrolling:touch;}
  .rail::-webkit-scrollbar{height:6px;}
  .rail::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:3px;}
  .rail .w-card{flex:0 0 200px; scroll-snap-align:start;}
  .rail .w-body{padding:13px 14px 15px; gap:5px;}
  .rail .w-card h3{font-size:14.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .rail .w-card p, .rail .w-more, .rail .w-host{display:none;}
  .rail .w-poster .ph .big{font-size:15px;}
  .rail .w-state, .rail .w-free{font-size:10.5px; padding:3px 8px; top:9px;}
  .rail .w-state{left:9px;} .rail .w-free{right:9px;}
  .empty-card{border:1.5px dashed var(--border-strong); border-radius:18px; aspect-ratio:4/5; max-height:520px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;
    color:var(--text-faint); padding:24px;}
  .empty-card b{color:var(--text-dim); font-size:18px;}
  .w-free.paid{background:rgba(124,77,255,.22); color:var(--purple-pale); border-color:rgba(169,139,255,.4);}
  @media(max-width:900px){ .duo{grid-template-columns:1fr; gap:64px;} }

  /* ---------- SECTION ---------- */
  .sec{margin-top:70px;}
  .sec-head{display:flex; align-items:baseline; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .sec-head h2{font-size:clamp(23px,2.6vw,30px); font-weight:700;}
  .sec-head .count{font-size:15px; color:var(--text-faint);}
  .sec-head p{flex-basis:100%; font-size:15.5px; color:var(--text-faint); margin-top:-6px;}

  .w-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px;}

  /* ---------- CARD ---------- */
  .w-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:18px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column;
    transition:border-color .2s ease, transform .2s ease;
  }
  .w-card:hover{border-color:var(--border-strong); transform:translateY(-3px);}
  .w-poster{
    position:relative; width:100%; aspect-ratio:4/5;
    background:linear-gradient(160deg,#2a1454,#4a2a8f 55%,#7c4dff);
    border-bottom:1px solid var(--border); overflow:hidden;
  }
  .w-poster img, .w-poster video{width:100%; height:100%; object-fit:cover; object-position:center; display:block;}
  .w-poster .ph{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:0 22px; text-align:center;
  }
  .w-poster .ph .big{font-size:21px; font-weight:700; line-height:1.4; color:#fff;}
  .w-poster .ph .sm{font-size:13.5px; color:rgba(255,255,255,.72);}
  .w-state{
    position:absolute; top:13px; left:13px;
    font-size:12px; font-weight:700; padding:5px 12px; border-radius:100px;
    background:rgba(8,5,15,.78); backdrop-filter:blur(8px);
  }
  .w-state.soon{color:var(--ok); border:1px solid rgba(95,208,138,.42);}
  .w-state.done{color:var(--text-dim); border:1px solid var(--border-strong);}
  .w-free{
    position:absolute; top:13px; right:13px;
    font-size:12px; font-weight:700; padding:5px 12px; border-radius:100px;
    background:rgba(232,184,94,.18); color:var(--gold-soft);
    border:1px solid rgba(243,216,154,.32); backdrop-filter:blur(8px);
  }
  .w-body{padding:20px 22px 22px; display:flex; flex-direction:column; gap:9px; flex:1;}
  .w-meta{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:13px;}
  .w-when{color:var(--purple-bright); font-weight:600; font-variant-numeric:tabular-nums;}
  .w-host{color:var(--text-faint);}
  .w-card h3{font-size:19px; font-weight:700; line-height:1.45;}
  .w-card p{font-size:14.5px; color:var(--text-dim); line-height:1.6; white-space:pre-line;}   /* 관리 페이지에서 친 줄바꿈 그대로 */
  .w-more{margin-top:auto; padding-top:8px; font-size:14.5px; font-weight:600; color:var(--gold-soft);}

  .no-result{display:none; color:var(--text-faint); font-size:15.5px; padding:40px 4px; text-align:center;}

  /* ---------- MODAL ---------- */
  .modal-back{
    position:fixed; inset:0; z-index:200; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(4,2,10,.8); backdrop-filter:blur(7px);
  }
  .modal-back.open{display:flex;}
  .modal{
    position:relative; width:min(1000px, 94vw); max-height:92vh;
    background:var(--bg-alt2); border:1px solid var(--border-strong);
    border-radius:22px; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.75);
  }
  .modal-head{padding:24px 64px 18px 28px; border-bottom:1px solid var(--border);}
  .modal-head .top{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:9px;}
  .modal-head h2{font-size:clamp(21px,3vw,27px); font-weight:700; line-height:1.4;}
  .modal-close{
    position:absolute; top:18px; right:20px; z-index:3;
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); font-size:19px; line-height:1;
  }
  .modal-close:hover{background:var(--surface);}
  .modal-scroll{padding:24px 28px 10px; overflow-y:auto; flex:1;}
  .modal-scroll::-webkit-scrollbar{width:8px;}
  .modal-scroll::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:4px;}

  /* 한눈에 보는 정보 */
  .facts{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;
    margin-bottom:24px;
  }
  .fact{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 16px;}
  .fact dt{
    font-family:'Space Grotesk',sans-serif; font-size:11.5px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px;
  }
  .fact dd{font-size:15px; font-weight:600;}

  .m-poster{border-radius:14px; border:1px solid var(--border); margin-bottom:22px; width:100%; display:block;}
  .m-poster + .w-form{margin-top:0;}
  /* 포스터 왼쪽 · 내용 오른쪽 */
  .m-split{display:grid; grid-template-columns:minmax(0,38%) minmax(0,1fr); gap:26px; align-items:start;}
  .m-left{position:static;}   /* 화면이 낮을 때 안내 박스가 가려지지 않게 고정 해제 */
  .m-left .m-poster{margin-bottom:0;}
  .m-right > .facts{grid-template-columns:repeat(2,minmax(0,1fr));}
  .m-right > .facts .fact dd{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.5;}
  .m-right .w-form{margin-top:4px;}
  .m-right .f-row{grid-template-columns:1fr;}
  @media(max-width:760px){
    .m-split{grid-template-columns:1fr; gap:18px;}
    .m-left{position:static; max-width:340px; width:100%; margin:0 auto;}
  }
  .m-embed{width:100%; aspect-ratio:16/9; border:0; border-radius:14px; margin-bottom:22px;}

  .modal-scroll h4{font-size:18px; font-weight:700; margin:24px 0 10px;}
  .modal-scroll p{font-size:16px; color:var(--text-dim); line-height:1.8; margin-bottom:14px;}
  .modal-scroll ul.blist{list-style:none; display:flex; flex-direction:column; gap:9px; margin-bottom:16px;}
  .modal-scroll ul.blist li{
    position:relative; padding-left:19px; font-size:16px; color:var(--text-dim); line-height:1.7;
  }
  .modal-scroll ul.blist li::before{
    content:''; position:absolute; left:2px; top:11px;
    width:6px; height:6px; border-radius:50%; background:var(--purple-bright);
  }
  .modal-scroll blockquote{
    border-left:3px solid var(--purple-bright); padding:4px 0 4px 16px;
    margin:0 0 16px; font-size:16.5px; color:var(--purple-pale); line-height:1.75;
  }
  .modal-scroll figure{margin-bottom:18px;}
  .modal-scroll figure img{width:100%; border-radius:13px; border:1px solid var(--border);}

  /* ---------- 유튜브 LIVE ---------- */
  .live{margin:72px 0 24px;}
  .live-card{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:32px; align-items:center; padding:24px; border-radius:24px;
    background:linear-gradient(135deg,rgba(124,77,255,.16),rgba(124,77,255,.04)); border:1px solid var(--border-strong);}
  .live-thumb{position:relative; display:block; border-radius:16px; overflow:hidden; aspect-ratio:16/9; border:1px solid var(--border);}
  .live-thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s;}
  .live-thumb:hover img{transform:scale(1.03);}
  .live-badge{position:absolute; top:12px; left:12px; display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:8px;
    background:#E5243B; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; letter-spacing:.08em;}
  .live-badge i{width:7px; height:7px; border-radius:50%; background:#fff; animation:liveBlink 1.4s ease-in-out infinite;}
  @keyframes liveBlink{50%{opacity:.25;}}
  .live-eb{font-size:13.5px; font-weight:700; color:var(--gold-soft);}
  .live-body h2{font-size:clamp(24px,3vw,32px); margin:6px 0 10px;}
  .live-body > p{color:var(--text-dim); font-size:15.5px; line-height:1.7;}
  .live-next{margin-top:16px; display:inline-block; padding:9px 15px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-size:15px;}
  .live-next b{color:var(--gold-soft);}
  .live-acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
  .live-form{margin-top:16px; padding:18px; border-radius:16px; background:var(--surface); border:1px solid var(--border);}
  .live-form[hidden]{display:none;}
  .live-foot{margin-top:12px; font-size:13px; color:var(--text-faint); display:flex; gap:12px; align-items:center;}
  .live-leave{background:none; border:none; color:var(--text-faint); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer;}
  @media(max-width:860px){ .live-card{grid-template-columns:1fr; gap:20px; padding:18px;} }

  /* ---------- 신청 폼 (팝업 안) ---------- */
  .w-form{
    margin:28px 0 14px; padding:24px 22px 22px; border-radius:18px;
    background:linear-gradient(160deg,rgba(124,77,255,.13),rgba(124,77,255,.03));
    border:1px solid var(--border-strong);
  }
  .w-form h4{margin:0 0 6px !important;}
  .w-form .lead{font-size:14.5px !important; margin-bottom:18px !important;}
  .f-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .f-field{display:flex; flex-direction:column; gap:6px;}
  .f-field.full{grid-column:1 / -1;}
  .f-field label{font-size:13.5px; font-weight:600; color:var(--text-dim);}
  .f-field label .opt{font-weight:400; color:var(--text-faint); margin-left:4px;}
  .f-field input{
    width:100%; padding:12px 14px; border-radius:11px; font:inherit; font-size:15.5px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
  }
  .f-field input:focus{outline:none; border-color:var(--purple-bright); box-shadow:0 0 0 3px rgba(124,77,255,.2);}
  .f-check{display:flex; gap:10px; align-items:flex-start; margin-top:10px; cursor:pointer;
    font-size:14px; color:var(--text-dim); line-height:1.6;}
  .f-check input{margin-top:4px; width:17px; height:17px; accent-color:var(--purple-bright); flex:none;}
  .f-check b{color:var(--text); font-weight:600;}
  .f-check small{display:block; color:var(--text-faint); font-size:12.5px;}
  .f-submit{margin-top:18px; width:100%;}
  .f-submit[disabled]{opacity:.6; cursor:default; transform:none;}
  .f-msg{margin-top:12px; font-size:14px; min-height:1em; color:#FF9C9C;}
  .f-done{text-align:center; padding:10px 4px 4px;}
  .f-done .ic{font-size:34px; margin-bottom:8px;}
  .f-done h4{margin:0 0 8px !important;}
  .f-done p{font-size:15px !important; margin:0 !important;}
  @media(max-width:600px){ .f-row{grid-template-columns:1fr;} .w-form{padding:20px 16px 18px;} }

  /* 맨 아래 — 멤버십은 여기서 딱 한 번, 짧게 */
  .m-foot{
    border-top:1px solid var(--border); padding:18px 28px 22px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 24px; border-radius:100px; border:none; cursor:pointer;
    font-weight:600; font-size:16px; font-family:inherit;
    transition:transform .2s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:linear-gradient(135deg,var(--purple),#9B6BFF); color:#fff;
    box-shadow:0 8px 26px rgba(124,77,255,.38);}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border-strong);}
  .m-foot .after{
    flex:1 1 220px; min-width:180px;
    font-size:13.5px; color:var(--text-faint); line-height:1.6;
  }
  .m-foot .after a{color:var(--purple-bright);}
  .m-share{margin-left:auto; flex:none; padding:9px 15px; border-radius:100px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    color:var(--text); background:var(--surface); border:1px solid var(--border-strong); white-space:nowrap;}
  .m-share:hover{border-color:var(--purple-bright);}
  .m-foot .after a:hover{text-decoration:underline;}

  /* ---------- FOOTER ---------- */
  footer{padding:70px 0 54px; border-top:1px solid var(--border); margin-top:90px;}
  .foot-grid{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:18px;}
  .foot-links{display:flex; gap:20px; font-size:15.5px; color:var(--text-faint);}
  .foot-links a:hover{color:var(--text);}
  .foot-note{margin-top:24px; font-size:14px; color:var(--text-faint); text-align:center;}

  @media(max-width:600px){
    .w-hero{padding:130px 0 6px;}
    .modal{width:100%; max-height:94vh;}
    .modal-head{padding:20px 58px 16px 20px;}
    .modal-scroll{padding:20px 20px 8px;}
    .m-foot{padding:12px 20px 16px;}
    .m-foot .after{display:none;}            /* 좁은 화면에선 아래 고정 영역을 버튼만 남기고 */
    .after-m{display:block !important;}     /* 같은 안내는 스크롤 맨 끝으로 */
    .btn{width:100%;}
    .modal-head h2{font-size:19px;}
    /* 일시 · 장소 · 참가비: 한 줄씩 가로로 */
    .facts{grid-template-columns:1fr !important; gap:0; border:1px solid var(--border); border-radius:13px; overflow:hidden;}
    .fact{display:flex; justify-content:space-between; align-items:center; gap:12px; border:none; border-radius:0;
      padding:11px 14px; border-bottom:1px solid var(--border);}
    .fact:last-child{border-bottom:none;}
    .fact dt{margin-bottom:0;}
    .fact dd{text-align:right;}
    /* 아직 클래스가 없을 때 빈 카드는 낮게 */
    .empty-card{aspect-ratio:auto; padding:34px 20px;}
    .w-hero .lead{font-size:16.5px;}
  }
  /* 툴킷 안내 박스 (포스터 아래) */
  .kit-note{margin-top:14px; padding:14px 15px; border-radius:13px; font-size:14px; line-height:1.65; color:var(--purple-pale);
    background:linear-gradient(160deg,rgba(124,77,255,.22),rgba(124,77,255,.06)); border:1px solid rgba(169,139,255,.45);}
  .kit-note b{color:#fff;}
  .kit-note button{display:block; margin-top:9px; background:none; border:none; padding:0; cursor:pointer;
    font:inherit; font-weight:700; color:var(--gold-soft);}
  .kit-note button:hover{text-decoration:underline; text-underline-offset:3px;}
  /* 툴킷 미리보기 */
  .peek-back{position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(8,5,15,.74); backdrop-filter:blur(3px);}
  .peek-back.open{display:flex;}
  .peek{position:relative; width:min(480px,100%); max-height:100%; overflow-y:auto; background:#1A1030;
    border:1px solid rgba(169,139,255,.5); border-radius:18px; padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.6);}
  .peek-x{position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:13px;}
  .peek-eb{font-family:'Space Grotesk',sans-serif; font-size:11.5px; letter-spacing:.16em; font-weight:700; color:var(--purple-bright);}
  .peek h3{font-size:19px; margin:6px 30px 6px 0; line-height:1.4;}
  .peek-lead{font-size:13.5px; color:var(--text-dim); line-height:1.6;}
  .peek-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:14px 0 12px;}
  .peek-card{border-radius:12px; border:1px solid var(--border); background:var(--surface); padding:12px;}
  .peek-card b{display:flex; align-items:center; gap:7px; font-size:13.5px; margin:7px 0 5px;}
  .peek-card .pi{width:19px; height:19px; flex:none; color:var(--purple-bright);}
  .peek-card:nth-child(3) .pi{color:var(--ok);}
  .peek-card:nth-child(4) .pi{color:var(--gold-soft);}
  .peek-card p{font-size:12.5px; color:var(--text-dim); line-height:1.55;}
  .pt{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px;}
  .pt.p1{background:rgba(124,77,255,.25); color:var(--purple-pale);}
  .pt.p2{background:rgba(95,208,138,.16); color:var(--ok);}
  .pt.p3{background:rgba(232,184,94,.18); color:var(--gold-soft);}
  .peek-lock{text-align:center; font-size:13px; font-weight:600; color:var(--gold-soft); margin-bottom:10px; line-height:1.55; word-break:keep-all;}
  .peek-go{width:100%;}
  @media(max-width:600px){ .peek-grid{grid-template-columns:1fr;} .peek{padding:18px;} }
  .after-m{display:none; font-size:13.5px; color:var(--text-faint); line-height:1.6; margin:18px 0 6px; text-align:center;}
  .after-m a{color:var(--purple-bright);}

  /* ---------- 프로그램 페이지 ---------- */
  .p-hero{padding:170px 0 10px; text-align:center;}
  .p-hero h1{font-size:clamp(30px,5vw,54px); font-weight:700; margin-top:16px; line-height:1.25;}
  .p-hero .lead{max-width:640px; margin:18px auto 0; font-size:18px; line-height:1.75; color:var(--text-dim);}
  .p-list{margin-top:64px; display:flex; flex-direction:column; gap:40px;}
  .p-card{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:40px; padding:32px; border-radius:26px;
          background:linear-gradient(160deg, rgba(124,77,255,.10), rgba(255,255,255,.03)); border:1px solid var(--border-strong);}
  @media(max-width:900px){ .p-card{grid-template-columns:1fr; padding:22px; gap:26px;} }
  .p-poster{border-radius:18px; overflow:hidden; background:linear-gradient(150deg,#2B1B66,#140D26); aspect-ratio:4/5; position:relative;}
  .p-poster img{width:100%; height:100%; object-fit:cover; display:block;}
  .p-poster .ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:10px;}
  .p-poster .ph small{font-family:'Space Grotesk'; letter-spacing:.16em; font-size:12px; color:var(--purple-pale);}
  .p-poster .ph b{font-size:clamp(26px,3vw,38px); color:#E3A6FF; line-height:1.25;}
  .p-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .p-chip{font-size:13px; font-weight:700; padding:5px 12px; border-radius:100px; background:rgba(95,208,138,.14); color:#7FD8A8;}
  .p-conf{font-size:13px; font-weight:800; padding:5px 12px; border-radius:100px; background:linear-gradient(135deg,#F4D58A,#E8B85E); color:#2A1A06;}
  .p-body h2{font-size:clamp(26px,3.2vw,38px); font-weight:700; margin:14px 0 10px; line-height:1.3;}
  .p-body .p-sub{font-size:16.5px; color:var(--text-dim); line-height:1.7;}
  .p-facts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:22px 0;}
  @media(max-width:560px){ .p-facts{grid-template-columns:1fr;} }
  .p-fact{padding:13px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border);}
  .p-fact dt{font-size:12.5px; color:var(--text-faint); font-weight:600;}
  .p-fact dd{font-size:15.5px; font-weight:600; margin-top:4px;}
  .p-acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .p-acts .btn[disabled]{opacity:.55; cursor:default;}
  .p-note{font-size:13.5px; color:var(--text-faint); margin-top:10px;}
  .p-catch{font-size:18px; font-weight:700; color:#D9A6FF; margin:-2px 0 10px;}
  .p-detail{max-width:760px; margin:40px auto 0; border-radius:22px; overflow:hidden; border:1px solid var(--border-strong); background:#26184C;}
  .p-detail img{display:block; width:100%; height:auto;}
  /* 카드뉴스 사이 쉼 공간: 앞 장 아래색(#26184C) → 다음 장 위색(#1A1033)으로 이어지는 별 배경 → 경계 없이 한 장처럼 */
  .p-seg{position:relative;}
  .p-gap{padding-top:8%;
         background:radial-gradient(1.2px 1.2px at 23px 31px,rgba(255,255,255,.75),transparent),radial-gradient(1px 1px at 97px 12px,rgba(255,255,255,.55),transparent),
                    radial-gradient(1.4px 1.4px at 151px 58px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 61px 77px,rgba(255,255,255,.45),transparent),
                    radial-gradient(1px 1px at 199px 39px,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 233px 84px,rgba(255,255,255,.6),transparent),
                    linear-gradient(#26184C,#1A1033);
         background-size:260px 96px,260px 96px,260px 96px,260px 96px,260px 96px,260px 96px,100% 100%;}
  /* 좌우로 넘겨 보는 묶음 (쉼의 정의 · 대표님 소개) */
  .p-rail-track{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain;}
  .p-rail-track::-webkit-scrollbar{display:none;}
  .p-rail-track img{flex:0 0 100%; scroll-snap-align:start;}
  .p-rail-btn{position:absolute; top:50%; transform:translateY(-50%); width:54px; height:54px; border-radius:50%; border:2px solid rgba(255,255,255,.9);
              background:#7C4DFF; color:#fff; font-size:28px; font-weight:700; line-height:1; cursor:pointer; padding-bottom:3px;
              box-shadow:0 0 0 6px rgba(124,77,255,.28),0 8px 22px rgba(0,0,0,.45); transition:opacity .2s;}
  .p-rail-btn.prev{left:14px;} .p-rail-btn.next{right:14px;}
  .p-rail-btn[disabled]{opacity:0; pointer-events:none;}
  .p-rail-btn.next.nudge{animation:pNudge 1.4s ease-in-out infinite;}
  @keyframes pNudge{0%,100%{transform:translateY(-50%) translateX(0);} 50%{transform:translateY(-50%) translateX(6px);}}
  /* 넘기기 표시줄: 점 + 몇 번째 장 (바탕은 이미지 아래색과 같게) */
  .p-rail-bar{display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 16px 4px; background:#26184C;}
  .p-dots{display:flex; gap:7px; flex-wrap:wrap; justify-content:center;}
  .p-dots button{width:9px; height:9px; padding:0; border:none; border-radius:5px; background:rgba(255,255,255,.35); cursor:pointer; transition:width .25s,background .25s;}
  .p-dots button.on{width:26px; background:#E3A6FF;}
  .p-rail-num{font-size:14px; font-weight:700; color:#fff; white-space:nowrap;}
  .p-rail-num small{font-weight:500; color:rgba(255,255,255,.7); margin-left:6px;}
  @media(max-width:560px){ .p-rail-btn{width:42px; height:42px; font-size:22px; box-shadow:0 0 0 4px rgba(124,77,255,.28),0 6px 16px rgba(0,0,0,.45);} .p-rail-btn.prev{left:8px;} .p-rail-btn.next{right:8px;}
                           .p-rail-bar{flex-direction:column; gap:8px;} .p-dots button{width:7px; height:7px;} .p-dots button.on{width:20px;} .p-rail-num{font-size:13px;} }
  .p-loading{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:15px;}
  .p-detail-foot{padding:26px; text-align:center; background:#26184C;}
  .p-wrap{scroll-margin-top:90px;}
  .p-detail{scroll-margin-top:90px;}
  .p-line{margin-top:30px;}
  .p-line h3{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; margin:22px 0 12px;}
  .p-line h3 small{font-family:'Space Grotesk'; font-size:11.5px; letter-spacing:.14em; color:var(--text-faint);}
  .p-people{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .p-person{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:14px; background:var(--surface); border:1px solid var(--border);}
  .p-ava{width:38px; height:38px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
         font-weight:700; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--purple),#C77DFF);}
  .p-person b{display:block; font-size:15px;}
  .p-person span{display:block; font-size:12.5px; color:var(--purple-pale); margin-top:1px;}
  .p-person em{display:inline-block; font-style:normal; font-size:10.5px; font-weight:700; color:#2A1A06; background:var(--gold-soft); padding:1px 6px; border-radius:6px; margin-top:4px;}
  .p-person.guest .p-ava{background:linear-gradient(135deg,#E8B85E,#C77DFF);}
</style>
</head>

    <h1>멤버들이 함께 만드는<br class="mbr"> 오프라인 프로그램</h1>
    <p class="lead">퍼플 유니버스 멤버들의 전문성을 하나로 모아,<br>하루 동안 직접 경험하는 프로그램을 엽니다.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="p-list" id="pList"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div style="font-weight:600;">퍼플 유니버스</div>
      <div class="foot-links">
        <a href="https://www.youtube.com/@purple-universe-kk" target="_blank" rel="noopener">YouTube</a>
        <a href="https://www.instagram.com/purpleuniverse.kk/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.tiktok.com/@purpleuniverse.kk" target="_blank" rel="noopener">TikTok</a>
      </div>
    </div>
    <p class="foot-note">© 2026 Purple Universe · HYONSLAB &amp; JuInSEE FILM</p>
  </div>
</footer>

<script>
/* ===================== 프로그램 목록 =====================
   새 프로그램은 PROGRAMS 에 하나 더 넣으면 카드가 생깁니다. (위가 먼저)
   applyUrl  : 신청 · 결제 링크 — 비어 있으면 '신청 오픈 예정'
   detailDir : 깃허브에 상세 이미지를 올린 폴더 — 파일 이름 순서(01, 02, …)대로 아래에 길게 이어 붙고,
               첫 번째 이미지가 카드 포스터로 쓰여요. 이미지를 더하거나 바꾸면 페이지는 고칠 필요 없음 */
const PROGRAMS = [
  {
    id: 'wellness',
    tag: '원데이 웰니스 · 힐링',
    title: '원데이 웰니스 프로그램',
    catch: '딱 하루, 온전히 나를 위한 휴식',
    sub: '누구의 엄마, 아빠, 대표로서 살아온 당신에게 — 체형 분석 · 스트레칭 · 아로마 케어 · 셰프의 저녁까지, 쉼을 선물합니다.',
    confirmed: true,
    date: '2026년 12월 13일 (일)',
    time: '12:00 ~ 20:00',
    place: '홍대 팀플레이스',
    cap: '30명 한정',
    price: '30만 원 (1인)',
    gift: '참가자 전원 웰니스 선물 박스 증정',
    poster: 'images/program-wellness/01.jpg',   // 카드 포스터 (없으면 상세 이미지 첫 장)
    detailDir: 'images/program-wellness',
    rails: [[2, 6], [18, 29]],   // 좌우로 넘겨 보는 묶음 — 파일 번호 범위 (쉼의 정의 02~06 · 대표님 소개 18~29)
    applyUrl: 'https://www.payapp.kr/L/z4m8VC',
    applyOpen: true           // ← false 로 바꾸면 버튼이 닫혀요. true 일 때 [프로그램 신청하기] 버튼이 열려요
  }
];

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const REPO = 'HYONYEON/purple-universe';
document.getElementById('pList').innerHTML = PROGRAMS.map(p => {
  const fact = (k, v) => v ? '<div class="p-fact"><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>' : '';
  const act = (p.applyUrl && p.applyOpen)
    ? '<a class="btn btn-primary" href="' + esc(p.applyUrl) + '" target="_blank" rel="noopener">프로그램 신청하기</a>'
    : '<button class="btn btn-primary" type="button" disabled>신청 오픈 예정</button>';
  return '<div class="p-wrap" id="' + esc(p.id) + '">' +
    '<article class="p-card">' +
      '<div class="p-poster" id="poster-' + esc(p.id) + '"><div class="ph"><small>PURPLE UNIVERSE · WELLNESS</small><b>' + esc(p.catch || p.title) + '</b></div>' +
        (p.poster ? '<img src="/' + esc(p.poster) + '" alt="' + esc(p.title) + ' 포스터" onerror="this.remove()" style="position:relative;">' : '') + '</div>' +
      '<div class="p-body">' +
        '<div class="p-top"><span class="p-chip">' + esc(p.tag) + '</span>' + (p.confirmed ? '<span class="p-conf">✓ 일정 확정</span>' : '') + '</div>' +
        '<h2>' + esc(p.title) + '</h2>' + (p.catch ? '<p class="p-catch">' + esc(p.catch) + '</p>' : '') + '<p class="p-sub">' + esc(p.sub) + '</p>' +
        '<dl class="p-facts">' + fact('일시', p.date) + fact('시간', p.time) + fact('장소', p.place) + fact('모집', p.cap) + fact('참가비', p.price) + fact('선물', p.gift) + '</dl>' +
        '<div class="p-acts">' + act + '</div>' +
      '</div>' +
    '</article>' +
    '<div class="p-detail" id="detail-' + esc(p.id) + '"><p class="p-loading">상세 내용을 불러오는 중…</p></div>' +
  '</div>';
}).join('');

/* 상세 이미지 — 깃허브 폴더 목록을 읽어 이름 순서대로 (10분 동안은 브라우저에 기억) */
async function listDir(dir){
  const key = 'pu_dir_' + dir;
  try{ const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if(c && Date.now() - c.t < 600000) return c.v; }catch(e){}
  const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + dir.split('/').map(encodeURIComponent).join('/'));
  if(r.status === 404) return [];                                  // 폴더가 아직 없음 → '준비 중'
  if(!r.ok) throw new Error(r.status);
  const v = (await r.json()).filter(x => x.type === 'file' && /\.(jpe?g|png|webp|gif)$/i.test(x.name))
    .map(x => x.name).sort((a, b) => a.localeCompare(b, undefined, { numeric:true }));
  try{ sessionStorage.setItem(key, JSON.stringify({ t:Date.now(), v })); }catch(e){}
  return v;
}
PROGRAMS.forEach(async p => {
  const box = document.getElementById('detail-' + p.id), poster = document.getElementById('poster-' + p.id);
  if(!p.detailDir){ box.remove(); return; }
  try{
    const files = await listDir(p.detailDir);
    if(!files.length){ box.innerHTML = '<p class="p-loading">상세 이미지를 준비하고 있어요.</p>'; return; }
    const url = n => '/' + p.detailDir + '/' + encodeURIComponent(n);
    const pi = poster.querySelector('img');
    if(!pi || (pi.complete && !pi.naturalWidth)) poster.insertAdjacentHTML('beforeend', '<img src="' + url(files[0]) + '" alt="' + esc(p.title) + ' 포스터" style="position:relative;">');
    const img = (n, i, cls) => '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="' + url(n) + '" alt="' + esc(p.title) + ' 상세 ' + (i + 1) + '"' + (i > 1 ? ' loading="lazy"' : '') + '>';
    const railOf = n => (p.rails || []).find(r => parseInt(n, 10) >= r[0] && parseInt(n, 10) <= r[1]);
    const segs = [];
    for(let i = 0; i < files.length; i++){
      const r = railOf(files[i]);
      if(!r){ segs.push(img(files[i], i, 'p-seg')); continue; }
      let j = i; while(j + 1 < files.length && railOf(files[j + 1]) === r) j++;
      segs.push('<div class="p-seg p-rail"><div class="p-rail-track">' + files.slice(i, j + 1).map((n, k) => img(n, i + k)).join('') + '</div>' +
        '<button class="p-rail-btn prev" type="button" aria-label="이전" disabled>‹</button><button class="p-rail-btn next" type="button" aria-label="다음">›</button></div>' +
        '<div class="p-rail-bar"><div class="p-dots">' + files.slice(i, j + 1).map((n, k) => '<button type="button" aria-label="' + (k + 1) + '번째"></button>').join('') + '</div>' +
        '<span class="p-rail-num"><b>1</b> / ' + (j - i + 1) + '<small>옆으로 넘겨 보세요</small></span></div>');
      i = j;
    }
    box.innerHTML = segs.join('<div class="p-gap"></div>') +
      '<div class="p-detail-foot">' + ((p.applyUrl && p.applyOpen) ? '<a class="btn btn-primary" href="' + esc(p.applyUrl) + '" target="_blank" rel="noopener">프로그램 신청하기</a>' : '<button class="btn btn-primary" type="button" disabled>신청 오픈 예정</button>') + '</div>';
    box.querySelectorAll('.p-rail').forEach(rl => {
      const tr = rl.querySelector('.p-rail-track'), pv = rl.querySelector('.prev'), nx = rl.querySelector('.next');
      const bar = rl.nextElementSibling, dots = [...bar.querySelectorAll('.p-dots button')], num = bar.querySelector('.p-rail-num b');
      const upd = () => {
        pv.disabled = tr.scrollLeft < 5; nx.disabled = tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 5;
        const k = Math.round(tr.scrollLeft / (tr.clientWidth || 1));
        dots.forEach((d, x) => d.classList.toggle('on', x === k)); num.textContent = k + 1;
        if(tr.scrollLeft > 5) nx.classList.remove('nudge');
      };
      nx.classList.add('nudge');
      dots.forEach((d, x) => d.onclick = () => tr.scrollTo({ left: x * tr.clientWidth, behavior: 'smooth' }));
      pv.onclick = () => tr.scrollBy({ left: -tr.clientWidth, behavior: 'smooth' });
      nx.onclick = () => tr.scrollBy({ left: tr.clientWidth, behavior: 'smooth' });
      tr.addEventListener('scroll', upd, { passive: true }); window.addEventListener('resize', upd);
      tr.querySelectorAll('img').forEach(im => im.addEventListener('load', upd)); upd();
    });
  }catch(e){
    box.innerHTML = '<p class="p-loading">상세 이미지를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
  }
});

/* 헤더 테두리 */
const header = document.getElementById('siteHeader');
window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 10), { passive:true });
/* 모바일 메뉴 */
(function(){
  const t = document.getElementById('navToggle'), m = document.getElementById('mobMenu');
  if(!t || !m) return;
  const setOpen = on => { t.classList.toggle('open', on); m.classList.toggle('open', on); t.setAttribute('aria-expanded', on ? 'true' : 'false'); };
  t.addEventListener('click', () => setOpen(!m.classList.contains('open')));
  m.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setOpen(false)));
  document.addEventListener('click', e => { if(m.classList.contains('open') && !m.contains(e.target) && !t.contains(e.target)) setOpen(false); });
  window.addEventListener('resize', () => { if(window.innerWidth > 980) setOpen(false); });
})();
</script>
</body>
</html>
