# 유튜브 최신 영상 자동 갱신
#
# 매일 한 번 채널을 확인해서 롱폼 4개 / 쇼츠 8개를 youtube-data.js 로 저장합니다.
# 내용이 그대로면 커밋하지 않으므로, 새 영상이 없는 날은 아무 일도 일어나지 않습니다.
#
# 올릴 위치: .github/workflows/youtube.yml
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions 에 YT_API_KEY 등록

name: 유튜브 최신 영상 갱신

on:
  schedule:
    - cron: '0 21 * * *'      # UTC 21:00 = 한국시간 매일 오전 6시
  workflow_dispatch:           # Actions 탭에서 직접 실행도 가능

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 최신 영상 가져오기
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node fetch-youtube.mjs

      - name: 바뀐 내용만 커밋
        run: |
          if [ -n "$(git status --porcelain youtube-data.js)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add youtube-data.js
            git commit -m "유튜브 최신 영상 갱신"
            git push
            echo "갱신했습니다."
          else
            echo "새 영상이 없어 그대로 둡니다."
          fi
